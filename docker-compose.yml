# Run the whole app locally:   docker compose up --build
# API on http://localhost:8000 (docs at /docs), UI on http://localhost:8501.
# Put GROQ_API_KEY (and optionally FRED_API_KEY) in a .env file next to this one.
# Without a key the API stops at start-up with a clear message.

services:
  api:
    build: .
    image: oil-forecaster-api
    ports:
      - "8000:8000"
    # Secrets are read from .env at run time (never baked into the image).
    # Using env_file rather than ${VAR:?} interpolation keeps commands like
    # `docker compose ps` and `down` working when .env is absent.
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: streamlit_ui/Dockerfile
    image: oil-forecaster-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
