name: Data refresh (every 3 weeks)

# Fetch fresh data, validate it and run the promotion gate. If a new model is
# promoted: open (or update) a pull request with the data, then run CI on that
# pull request so its checks test the new data and model. If nothing is
# promoted: no pull request and no CI run.
#
# Flow: refresh -> PR with passing checks -> a person merges -> CI on main ->
# Render deploys main after its checks pass (and retrains on the new data).

# Cadence: every third Thursday. Cron cannot say "every 3 weeks", so the
# schedule fires weekly and the first step skips two weeks out of three
# (counted from ANCHOR_DATE). Skipped weeks finish green in seconds, so they
# never hold back Render's "deploy after CI checks pass". A manual run
# (Actions -> Run workflow) always refreshes.

on:
  schedule:
    # Thursdays 14:00 UTC: after EIA's Wednesday inventory release, and once
    # FRED has published the previous week's Brent prices.
    - cron: "0 14 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write        # push the refresh branch
  pull-requests: write   # open / update the review PR
  actions: write         # dispatch CI on the PR branch (see the last step)

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  REFRESH_BRANCH: automated/data-refresh
  ANCHOR_DATE: "2026-11-19"   # a refresh Thursday; refreshes repeat every 3 weeks from it
  EVERY_WEEKS: "3"

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: "latest" moved to 26.04, which has no Python 3.11.8 build
    timeout-minutes: 30
    steps:
      - name: Is this a refresh week?
        id: due
        run: |
          weeks=$(( ( $(date -u +%s) - $(date -u -d "$ANCHOR_DATE" +%s) ) / 604800 ))
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ $(( weeks % EVERY_WEEKS )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a refresh week ($weeks weeks since $ANCHOR_DATE; refreshing every $EVERY_WEEKS)."
          fi

      - uses: actions/checkout@v7
        if: steps.due.outputs.run == 'true'

      - uses: actions/setup-python@v7
        if: steps.due.outputs.run == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: pip install --require-hashes -r requirements.lock

      - name: Fetch, validate, gate and promote
        id: weekly
        if: steps.due.outputs.run == 'true'
        run: python -m pipeline.weekly
        env:
          # Both keys are required here (free to register). Keyless fallbacks work from a
          # laptop but failed from GitHub's shared runners: FRED's website CSV timed out
          # (run #1) and EIA refused the shared DEMO_KEY (run #2). The job checks for both
          # before fetching anything.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Keep the reports with the run
        if: always() && steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: data-refresh-reports
          path: |
            reports/data/
            data/staging/manifest.json
          if-no-files-found: ignore

      - name: Open or update the review pull request
        id: pr
        if: steps.weekly.outputs.promoted == 'true'
        # Needs: Settings -> Actions -> General -> Workflow permissions ->
        # "Allow GitHub Actions to create and approve pull requests".
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.REFRESH_BRANCH }}
          delete-branch: true
          commit-message: "Promote data through ${{ steps.weekly.outputs.data_last }}"
          title: "Data refresh: data through ${{ steps.weekly.outputs.data_last }}"
          body-path: reports/data/promotion.md
          add-paths: |
            data/raw/*.csv
            data/oil_macro_weekly.csv
            data/oil_macro_transformed.csv
            data/manifest.json
            models/registry.json
            reports/data/*.md
          labels: automated, data-refresh

      - name: Run CI on the pull request
        # A pull request opened with the workflow's own token does not start
        # other workflows (GitHub prevents loops), so the PR would show no checks.
        # A workflow_dispatch is the documented exception: it runs CI on the PR
        # branch, and the results appear as the PR's checks, including training
        # the model on the new data.
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$REFRESH_BRANCH"
          echo "CI dispatched for PR #${{ steps.pr.outputs.pull-request-number }} (${{ steps.pr.outputs.pull-request-url }})"
