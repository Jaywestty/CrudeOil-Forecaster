name: CI

# One job, one run per commit:
#   - pull requests and pushes to main run the test suite and check the
#     Streamlit UI's dependencies;
#   - the data refresh (every 3 weeks) dispatches this workflow on its pull-request
#     branch after promoting new data, and there it also trains the model on
#     that data and serves a simulation with it.
# Render deploys main once a commit's checks pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish, because Render
  # deploys main once all of a commit's checks pass.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REFRESH_BRANCH: automated/data-refresh

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04   # pinned: "latest" moved to 26.04, which has no Python 3.11.8 build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version   # same Python as the Render deployment
          cache: pip
          cache-dependency-path: |
            requirements.lock
            streamlit_ui/requirements.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock   # exact versions that ship

      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the Streamlit UI's dependencies
        # Streamlit Cloud installs streamlit_ui/requirements.txt on its own. This
        # catches conflicts there (e.g. pyarrow needing a newer NumPy than pandas
        # allows), which otherwise only fail at runtime when a table renders.
        run: |
          python -m venv /tmp/ui
          /tmp/ui/bin/pip install -q --require-hashes -r streamlit_ui/requirements.lock
          /tmp/ui/bin/pip check
          /tmp/ui/bin/python -m py_compile streamlit_ui/app_ui.py
          /tmp/ui/bin/python -c "import pandas, pyarrow, streamlit, plotly; pyarrow.Table.from_pandas(pandas.DataFrame({'a': [1.0]})); print('UI dependencies OK')"

      - name: Train the model on the promoted data and serve a simulation
        # Only on the data-refresh branch: this is the model Render will build
        # when the refresh pull request is merged.
        if: github.ref_name == env.REFRESH_BRANCH
        env:
          GROQ_API_KEY: ci-placeholder   # the LLM is not needed for /simulate-direct
        run: |
          python train.py
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          client = TestClient(app.app)
          health = client.get("/health").json()
          print("health:", health)
          assert health["model_loaded"], health
          r = client.post("/simulate-direct?scenario_key=opec_cut&forecast_weeks=12")
          assert r.status_code == 200, r.text
          body = r.json()
          assert body["scenario_mean"] > 0, body
          print("simulation OK:", body["impact_week12"]["formatted"], "from", body["current_price"])
          PY
